<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Email Zimbra Offline</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B6777">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --text:#1A1D1F;
    --text-secondary:#6B7280;
    --accent:#2B6777;
    --accent-soft:#E4EEF0;
    --border:#E5E7EB;
    --danger:#C1440E;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Roboto","Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    overscroll-behavior:none;
  }
  #app{height:100vh; display:flex; flex-direction:column;}

  /* ---- App bar ---- */
  .appbar{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px 14px 28px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:10;
  }
  .appbar h1{font-size:17px; margin:0; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .icon-btn{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--text); display:inline-flex; align-items:center; justify-content:center;
    border-radius:8px; min-width:44px; min-height:44px; font-size:19px;
    flex-shrink:0;
  }
  .icon-btn:active{background:var(--accent-soft);}

  .offline-pill{
    font-size:11px; padding:3px 8px; border-radius:20px;
    background:#FDECE3; color:var(--danger); font-weight:600;
    display:none;
  }
  body.offline .offline-pill{display:inline-block;}

  /* ---- Screens ---- */
  .screen{flex:1; overflow-y:auto; display:none;}
  .screen.active{display:block;}

  /* ---- Login ---- */
  #screen-login.active{display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-box{width:100%; max-width:360px;}
  .login-box h2{margin:0 0 4px; font-size:22px;}
  .login-box p{margin:0 0 24px; color:var(--text-secondary); font-size:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; margin-bottom:6px; color:var(--text-secondary);}
  .field input{
    width:100%; padding:12px 14px; border:1px solid var(--border);
    border-radius:var(--radius); font-size:15px; background:var(--surface); color:var(--text);
  }
  .field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn-primary{
    width:100%; padding:13px; background:var(--accent); color:#fff;
    border:none; border-radius:var(--radius); font-size:15px; font-weight:600;
    cursor:pointer; margin-top:6px;
  }
  .btn-primary:active{opacity:.85;}
  .btn-primary:disabled{opacity:.5;}
  .error-msg{color:var(--danger); font-size:13px; margin-top:10px; display:none;}

  /* ---- Folder drawer ---- */
  #drawer-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:none;
  }
  #drawer{
    position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px;
    background:var(--surface); z-index:21; transform:translateX(-100%);
    transition:transform .2s ease; padding:18px 0; overflow-y:auto;
  }
  #drawer.open{transform:translateX(0);}
  #drawer-backdrop.open{display:block;}
  .drawer-header{padding:0 18px 16px; border-bottom:1px solid var(--border); margin-bottom:8px;}
  .drawer-header .acc{font-weight:600; font-size:14px;}
  .drawer-header .srv{font-size:12px; color:var(--text-secondary);}
  .folder-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 18px; cursor:pointer; font-size:14.5px;
  }
  .folder-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
  .folder-item .badge{
    font-size:11px; background:var(--accent); color:#fff; border-radius:10px;
    padding:1px 7px; min-width:18px; text-align:center;
  }
  .drawer-footer{padding:14px 18px 0; border-top:1px solid var(--border); margin-top:8px;}
  .link-danger{color:var(--danger); font-size:13.5px; background:none; border:none; padding:8px 0; cursor:pointer;}

  /* ---- Message list ---- */
  .msg-item{
    display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .msg-item:active{background:var(--accent-soft);}
  .msg-item .dot{
    width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;
    background:var(--accent);
  }
  .msg-item.read .dot{background:transparent;}
  .msg-item .body{min-width:0; flex:1;}
  .msg-item .row1{display:flex; justify-content:space-between; gap:8px;}
  .msg-item .from{font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .msg-item.read .from{font-weight:400;}
  .msg-item .date{font-size:12px; color:var(--text-secondary); flex-shrink:0;}
  .msg-item .subj{font-size:14px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .msg-item .snippet{font-size:12.5px; color:var(--text-secondary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .msg-item .clip{font-size:12px; color:var(--text-secondary); margin-top:3px;}

  .empty-state{padding:60px 24px; text-align:center; color:var(--text-secondary);}
  .empty-state .big{font-size:15px; color:var(--text); margin-bottom:6px; font-weight:600;}

  .load-more{padding:14px; text-align:center; color:var(--accent); font-size:14px; cursor:pointer;}

  /* ---- Message detail ---- */
  .detail-pad{padding:18px 16px 90px;}
  .detail-pad h2{font-size:19px; margin:0 0 14px; line-height:1.35;}
  .who-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;}
  .who-row .name{font-weight:600; font-size:14.5px;}
  .who-row .date{font-size:12px; color:var(--text-secondary);}
  .to-line{font-size:12.5px; color:var(--text-secondary); margin-bottom:16px;}
  .body-html{font-size:14.5px; line-height:1.6; word-wrap:break-word;}
  .body-html img{max-width:100%;}
  .attach-list{margin-top:20px; border-top:1px solid var(--border); padding-top:14px;}
  .attach-chip{
    display:inline-flex; align-items:center; gap:8px; border:1px solid var(--border);
    border-radius:var(--radius); padding:9px 12px; margin:0 8px 8px 0; font-size:13px; cursor:pointer;
  }
  .detail-actions{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--border); padding:10px 16px; display:flex; gap:10px;
  }
  .detail-actions button{
    flex:1; padding:11px; border-radius:var(--radius); border:1px solid var(--border);
    background:var(--surface); font-size:14px; font-weight:600; color:var(--text); cursor:pointer;
  }
  .detail-actions button.primary{background:var(--accent); color:#fff; border:none;}

  /* ---- Compose ---- */
  #compose-sheet{
    position:fixed; inset:0; background:var(--bg); z-index:30;
    display:none; flex-direction:column;
  }
  #compose-sheet.open{display:flex;}
  .compose-field{border-bottom:1px solid var(--border); padding:12px 16px;}
  .compose-field input{width:100%; border:none; background:none; font-size:15px; outline:none; color:var(--text);}
  .compose-field label{font-size:12px; color:var(--text-secondary); display:block; margin-bottom:2px;}
  #compose-body{
    flex:1; border:none; background:none; padding:16px; font-size:15px;
    font-family:inherit; resize:none; outline:none; color:var(--text);
  }

  /* ---- FAB ---- */
  .fab{
    position:fixed; right:18px; bottom:22px; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:26px;
    box-shadow:0 4px 14px rgba(43,103,119,.35); cursor:pointer; z-index:5;
    display:flex; align-items:center; justify-content:center;
  }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:#1A1D1F; color:#fff; padding:10px 18px; border-radius:24px;
    font-size:13.5px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{opacity:1;}

  .spinner{
    width:22px; height:22px; border:3px solid var(--accent-soft); border-top-color:var(--accent);
    border-radius:50%; animation:spin .7s linear infinite; margin:40px auto;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ LOGIN ============ -->
  <section id="screen-login" class="screen active">
    <div class="login-box">
      <h2>Email Zimbra Offline</h2>
      <p>Masuk dengan akun Zimbra kamu untuk mulai sinkronisasi.</p>
      <div class="field">
        <label>Alamat server Zimbra</label>
        <input id="in-server" type="url" placeholder="https://mail.perusahaanku.com" autocapitalize="off">
      </div>
      <div class="field">
        <label>Email</label>
        <input id="in-user" type="email" placeholder="nama@perusahaanku.com" autocapitalize="off">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="in-pass" type="password" placeholder="Password">
      </div>
      <button class="btn-primary" id="btn-login">Masuk</button>
      <div class="error-msg" id="login-error"></div>
    </div>
  </section>

  <!-- ============ INBOX (list) ============ -->
  <section id="screen-inbox" class="screen">
    <header class="appbar">
      <button class="icon-btn" id="btn-open-drawer">☰</button>
      <h1 id="folder-title">Inbox</h1>
      <span class="offline-pill">OFFLINE</span>
      <button class="icon-btn" id="btn-search">🔍</button>
      <button class="icon-btn" id="btn-refresh">⟳</button>
    </header>
    <div id="search-bar" style="display:none; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface);">
      <input id="search-input" type="text" placeholder="Cari nama, alamat, atau subjek..." style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius); font-size:14.5px;">
    </div>
    <div id="sync-progress" style="display:none; padding:10px 16px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:600;"></div>
    <div id="msg-list"></div>
    <button class="fab" id="btn-compose">✎</button>
  </section>

  <!-- ============ DETAIL PESAN ============ -->
  <section id="screen-detail" class="screen">
    <header class="appbar">
      <button class="icon-btn" id="btn-back-detail">←</button>
      <h1>Pesan</h1>
    </header>
    <div id="detail-content"></div>
  </section>

  <!-- ============ DRAWER FOLDER ============ -->
  <div id="drawer-backdrop"></div>
  <nav id="drawer">
    <div class="drawer-header">
      <div class="acc" id="drawer-user">-</div>
      <div class="srv" id="drawer-server">-</div>
    </div>
    <div id="folder-list"></div>
    <div class="drawer-footer" style="border-top:none; padding-top:0;">
      <button class="link-danger" id="btn-sync-all" style="color:var(--accent);">⬇️ Unduh Semua Pesan Folder Ini</button>
    </div>
    <div class="drawer-footer">
      <button class="link-danger" id="btn-logout">Keluar</button>
    </div>
  </nav>

  <!-- ============ COMPOSE ============ -->
  <div id="compose-sheet">
    <header class="appbar">
      <button class="icon-btn" id="btn-close-compose">✕</button>
      <h1>Tulis Email</h1>
      <button class="icon-btn" id="btn-send" style="color:var(--accent); font-weight:600;">Kirim</button>
    </header>
    <div class="compose-field">
      <label>Kepada</label>
      <input id="compose-to" type="email" placeholder="penerima@contoh.com">
    </div>
    <div class="compose-field">
      <label>Subjek</label>
      <input id="compose-subject" type="text" placeholder="Subjek email">
    </div>
    <textarea id="compose-body" placeholder="Tulis pesan..."></textarea>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
